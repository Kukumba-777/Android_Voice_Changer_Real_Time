name: Build AVCRT APK

on:
  pull_request:
  workflow_dispatch:
    inputs:
      compile_sdk:
        description: Type the Android API level to compile against (for example, 34 or 35)
        type: string
        default: '34'
        required: true
      send_to_telegram:
        description: Send the APK to Telegram
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: avcrt-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_COMPILE_SDK: ${{ inputs.compile_sdk || '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Set up Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Build APK and module
        run: |
          ./build_avcrtd.sh
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
            ksu-module/build/outputs/avcrt-module.zip \
            ksu-module/build/outputs/avcrt-module-cellular.zip artifacts/
          (cd artifacts && sha256sum *.apk *.zip > build-artifacts.sha256)
          {
            echo '### AVCRT build artifacts'
            echo '```text'
            cat artifacts/build-artifacts.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK, module, and checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: avcrt-debug-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/

  telegram:
    name: Send debug APK to Telegram
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.send_to_telegram && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: avcrt-debug-${{ github.sha }}
          path: artifacts

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in repository Actions secrets." >&2
            exit 1
          fi

          (cd artifacts && sha256sum --check build-artifacts.sha256)
          apk="artifacts/app-debug.apk"
          apk_size="$(stat -c '%s' "$apk")"
          if (( apk_size > 50 * 1024 * 1024 )); then
            echo "APK exceeds Telegram Bot API's 50 MB upload limit." >&2
            exit 1
          fi

          response="$(curl --silent --fail --max-time 180 \
            --form-string "chat_id=$TELEGRAM_CHAT_ID" \
            --form "document=@$apk;filename=avcrt-debug.apk;type=application/vnd.android.package-archive" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument")" || {
              echo 'Telegram APK upload failed.' >&2
              exit 1
          }
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); sys.exit(0 if d.get("ok") else (print("Telegram rejected the APK upload.", file=sys.stderr) or 1))' "$response"
